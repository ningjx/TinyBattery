name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test TinyBattery.slnx -c Release

      - name: Publish
        run: dotnet publish src/TinyBattery.App/TinyBattery.App.csproj -c Release -p:PublishProfile=win-x64

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path artifacts/publish/win-x64/TinyBattery.exe `
            -DestinationPath dist/TinyBattery-win-x64.zip `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyBattery-win-x64
          path: dist/TinyBattery-win-x64.zip

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "$env:GITHUB_REF_NAME"
          }

          if (-not $version.StartsWith("v")) {
            $version = "v$version"
          }

          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: TinyBattery ${{ steps.version.outputs.VERSION }}
          body: |
            ## TinyBattery ${{ steps.version.outputs.VERSION }}

            Windows 托盘电量监视器，设备与 SVG 图标主题均以插件形式加载。

            ### 下载
            - `TinyBattery-win-x64.zip` - Windows x64 单文件版，无需安装 .NET

            ### 使用方法
            1. 解压 ZIP 文件
            2. 运行 `TinyBattery.exe`
            3. 在托盘右键菜单选择主题和设备；设置页可导入 `.tbpack` 包
          files: |
            dist/TinyBattery-win-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
